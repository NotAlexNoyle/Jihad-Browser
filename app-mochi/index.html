<html>
<head>
	<meta charset="utf-8"/>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
	<title>Jihad Browser</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<!-- ── LunaSysMgr's Mojo namespace — DEFINED FIRST, before any framework ─────────────────
	     LunaSysMgr calls into a global `Mojo` object on every app, whatever framework it uses.
	     Enyo 1.0 provides it deliberately ("LunaSysMgr calls use Mojo namespace atm" —
	     framework/source/palm/system/windows/events.js), which is why the Enyo variant never
	     saw this. A bundled Enyo 2 + Mochi app has no such layer, so every one of those calls
	     threw `Uncaught ReferenceError: Mojo is not defined` — observed once per card launch.
	     It was previously written off in this file as an unrelated legacy probe; it is not.

	     Consequences of leaving it undefined, in order of how much they bite:
	       - relaunch() throwing means sysmgr never learns the relaunch succeeded. Enyo 1.0's
	         comment is explicit that it must RETURN TRUE, "otherwise it'll try to focus the
	         app". That is also the path that carries a launch target, so "open this URL in
	         Jihad Mochi" while the card is already open had nowhere to land.
	       - stageActivated/Deactivated, show/hide, keyboardShown, positiveSpaceChanged and
	         lowMemoryNotification are how the system tells a card it was minimised, the
	         keyboard appeared, the usable height changed, or memory is short.

	     Defined before the framework scripts on purpose: sysmgr may call at any point after
	     load, and a handler that does not exist yet is the bug being fixed. -->
	<script type="text/javascript">
	(function () {
		var Mojo = window.Mojo = window.Mojo || {};
		function app() { return window.jihadApp || null; }
		function call(fn, a) { var x = app(); try { return x && x[fn] ? x[fn](a) : undefined; } catch (e) { return undefined; } }

		//* Every "launch" of an already-running card lands here. Return TRUE or sysmgr
		//* re-focuses the app instead of believing us.
		Mojo.relaunch = function () {
			try {
				var p = window.PalmSystem && window.PalmSystem.launchParams;
				var o = (typeof p === "string" && p) ? JSON.parse(p) : (p || null);
				var url = o && (o.target || o.url);
				var x = app();
				if (url && x && x.openUrl) { x.openUrl(url); }
			} catch (e) { /* a malformed param must not break the relaunch handshake */ }
			return true;
		};

		Mojo.stageActivated       = function () { call("jihadStageActivated");   return true; };
		Mojo.stageDeactivated     = function () { call("jihadStageDeactivated"); return true; };
		Mojo.show                 = function () { call("jihadStageActivated");   return true; };
		Mojo.hide                 = function () { call("jihadStageDeactivated"); return true; };
		Mojo.keyboardShown        = function (shown) { call("jihadKeyboardShown", shown); return true; };
		Mojo.positiveSpaceChanged = function (space) { call("jihadPositiveSpaceChanged", space); return true; };
		Mojo.lowMemoryNotification = function (params) { call("jihadLowMemory", params); return true; };
	})();
	</script>
	<!-- Enyo 2 core (bundled from the enyo 2.x framework at build time) -->
	<script src="enyo/enyo.js" type="text/javascript"></script>
	<!-- Layout library (FittableRows/Columns, Panels, List) -->
	<script src="lib/layout/package.js" type="text/javascript"></script>
	<!-- Mochi UI library (bundled from ../../mochi at build time) -->
	<script src="lib/mochi/package.js" type="text/javascript"></script>
	<!-- Application -->
	<script src="source/package.js" type="text/javascript"></script>
</head>
<body>
<script type="text/javascript">
	// Published so the Mojo bridge above (defined before the framework loaded) can reach the
	// live app once it exists — sysmgr may call relaunch() at any time after this point.
	window.jihadApp = new JihadBrowser({classes: "enyo-unselectable enyo-fit"});
	window.jihadApp.renderInto(document.body);
	// webOS shows the app card's loading spinner until the app signals it has
	// rendered. The Enyo-1 variant gets this for free via the system framework's
	// launch="bridged"; this bundled Enyo-2 app must call stageReady() itself, or
	// the card "loads forever and never opens" (device report). Guarded: no-op off
	// device. (The "Mojo is not defined" error this file used to dismiss as legacy was real —
	// see the Mojo bridge in <head>.)
	if (window.PalmSystem && window.PalmSystem.stageReady) {
		window.PalmSystem.stageReady();
	}
	// NOTE (orientation / tiling): the web-content plugin composites CLEANLY only when
	// the device is held PHYSICALLY in landscape (display + card both native 1024). A
	// PORTRAIT card (768 wide) — or a card forced to landscape via setWindowOrientation
	// while the device is physically portrait — is composited by LunaCE at a mismatched
	// surface pitch that shears/"tiles" the plugin. This is a LunaCE-side limitation (the
	// closed PGContext plugin-paint path Jihad avoids); it is tied to the PHYSICAL
	// framebuffer orientation, so a logical orientation lock cannot force the clean path
	// (it just yields an upside-down, still-tiled card). Left as free rotation so physical
	// landscape stays clean. See [[jihad-input-activation-and-tiling]].
</script>
</body>
</html>
