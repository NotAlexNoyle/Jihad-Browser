<html>
<head>
	<meta charset="utf-8"/>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
	<title>Jihad Browser</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<!-- Enyo 2 core (bundled from the enyo 2.x framework at build time) -->
	<script src="enyo/enyo.js" type="text/javascript"></script>
	<!-- Layout library (FittableRows/Columns, Panels, List) -->
	<script src="lib/layout/package.js" type="text/javascript"></script>
	<!-- Mochi UI library (bundled from ../../mochi at build time) -->
	<script src="lib/mochi/package.js" type="text/javascript"></script>
	<!-- Application -->
	<script src="source/package.js" type="text/javascript"></script>
</head>
<body>
<script type="text/javascript">
	new JihadBrowser({classes: "enyo-unselectable enyo-fit"}).renderInto(document.body);
	// webOS shows the app card's loading spinner until the app signals it has
	// rendered. The Enyo-1 variant gets this for free via the system framework's
	// launch="bridged"; this bundled Enyo-2 app must call stageReady() itself, or
	// the card "loads forever and never opens" (device report). Guarded: no-op off
	// device. (The webOS-injected "Mojo is not defined" probe is unrelated legacy.)
	if (window.PalmSystem && window.PalmSystem.stageReady) {
		window.PalmSystem.stageReady();
	}
	// NOTE (orientation / tiling): the web-content plugin composites CLEANLY only when
	// the device is held PHYSICALLY in landscape (display + card both native 1024). A
	// PORTRAIT card (768 wide) — or a card forced to landscape via setWindowOrientation
	// while the device is physically portrait — is composited by LunaCE at a mismatched
	// surface pitch that shears/"tiles" the plugin. This is a LunaCE-side limitation (the
	// closed PGContext plugin-paint path Jihad avoids); it is tied to the PHYSICAL
	// framebuffer orientation, so a logical orientation lock cannot force the clean path
	// (it just yields an upside-down, still-tiled card). Left as free rotation so physical
	// landscape stays clean. See [[jihad-input-activation-and-tiling]].
</script>
</body>
</html>
