<!-- Jihad Browser (Mojo) — print: the printers the browser's daemon finds, one tap prints. -->
<div id="jihad-print" class="jihad-history">
	<div class="jihad-history-header palm-header">Print</div>
	<div id="jihad-print-status" class="jihad-print-status"></div>
	<div x-mojo-element="List" id="jihad-print-list" class="jihad-history-list"></div>
	<div class="jihad-print-manual">
		<div x-mojo-element="TextField" id="jihad-print-address" class="jihad-print-address"></div>
	</div>
	<div class="jihad-history-actions">
		<div x-mojo-element="Button" id="jihad-print-search" class="jihad-history-clear"></div>
		<div x-mojo-element="Button" id="jihad-print-close" class="jihad-history-clear"></div>
	</div>
</div>
