<!--
	The start page the Mojo variant opens on. It is loaded THROUGH the engine (the
	scene assistant hands Mojo.appPath + "start.html" to the WebView's openURL), so
	the card opens on a real rendered page rather than an empty render surface, and
	it needs no network. It is a plain document on purpose: nothing here talks to
	the adapter, the daemon or any Luna service.

	Laid out to match the Enyo and Mochi variants' start pages — the same bundled
	logo, name, engine line and hint, in the same order and the same colours — so
	the three front-ends open identically. Those two build the page as app chrome
	from their own frameworks; this one is a document, because a Mojo scene has no
	equivalent overlay and the packaged file renders through our own engine anyway.
-->
<html>
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Jihad Browser</title>
	<style type="text/css">
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #1c1c1c;
			color: #e6e6e6;
			font-family: Prelude, Helvetica, Arial, sans-serif;
			-webkit-text-size-adjust: none;
		}
		.wrap {
			box-sizing: border-box;
			width: 100%;
			max-width: 34em;
			margin: 0 auto;
			padding: 14% 8% 8% 8%;
			text-align: center;
		}
		/* Logo box sized as in the sibling variants (132px square). */
		.logo {
			display: block;
			width: 132px;
			height: 132px;
			margin: 0 auto 18px auto;
		}
		h1 {
			margin: 0;
			font-size: 30px;
			font-weight: bold;
			letter-spacing: 1px;
			color: #f0f0f0;
		}
		.sub {
			margin: 8px 0 0 0;
			font-size: 15px;
			color: #8cafbe;
		}
		.hint {
			margin: 22px 0 0 0;
			font-size: 17px;
			line-height: 24px;
			color: #b4b4b4;
		}
		ul {
			display: inline-block;
			margin: 1.6em 0 0 0;
			padding: 0;
			text-align: left;
			list-style: none;
		}
		li {
			margin: 0.5em 0;
			font-size: 1.05em;
		}
		a {
			color: #6fb4ff;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<div class="wrap">
		<img class="logo" src="icon-256x256.png" alt=""/>
		<h1>Jihad Browser</h1>
		<p class="sub">Mojo UI &#9733; Goanna/6.9 UXP/b2594a4</p>
		<p class="hint">Type a web address or a search in the bar above, then press Enter.</p>
		<ul id="links">
			<li><a href="https://duckduckgo.com/">DuckDuckGo</a></li>
			<li><a href="https://en.m.wikipedia.org/">Wikipedia</a></li>
			<li><a href="https://webosarchive.org/">webOS Archive</a></li>
		</ul>
	</div>
	<script type="text/javascript">
	// The shortcuts are editable in settings, but this page is rendered by the ENGINE
	// and cannot read the card's localStorage — so the scene passes the list in the
	// url fragment (main-assistant.js startPageUrl()). The markup above is the
	// default, left in place so the page still shows shortcuts when opened directly
	// with no fragment and when script is off.
	(function () {
		var m = /(?:^|[#&])links=([^&]*)/.exec(window.location.hash || "");
		if (!m) { return; }
		var list;
		try { list = JSON.parse(decodeURIComponent(m[1])); } catch (e) { return; }
		if (!list || !list.length) { return; }
		var ul = document.getElementById("links");
		if (!ul) { return; }
		while (ul.firstChild) { ul.removeChild(ul.firstChild); }
		for (var i = 0; i < list.length; i++) {
			var title = list[i] && list[i].title, url = list[i] && list[i].url;
			if (!title || !url) { continue; }
			var li = document.createElement("li");
			var a = document.createElement("a");
			// href is assigned, and the label goes in as TEXT — the list is
			// user-supplied, so it is never turned into markup.
			a.setAttribute("href", String(url));
			a.appendChild(document.createTextNode(String(title)));
			li.appendChild(a);
			ul.appendChild(li);
		}
	}());
	</script>
</body>
</html>
