#
# BitBake layer registration for the Jihad OE layer, so the Full-OE path in
# docs/DEVICE-BUILD.md ("add build/webos-oe as a layer") is actually runnable:
# add this directory to BBLAYERS and the recipes-jihad/ tree + machine confs
# become discoverable. Style mirrors meta-webos/conf/layer.conf (webOS-era OE;
# no LAYERSERIES_COMPAT — that predates the series mechanism, and modern
# bitbake only warns).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-jihad/*/*.bb ${LAYERDIR}/recipes-jihad/*/*.bbappend"

BBFILE_COLLECTIONS += "jihad"
BBFILE_PATTERN_jihad = "^${LAYERDIR}/"
BBFILE_PRIORITY_jihad = "10"
