#@TYPE: Machine
#@NAME: HP TouchPad Go (Opal)
#@DESCRIPTION: HP TouchPad Go — 7" 1024x768 (higher DPI), webOS 3.0.5, ARMv7 softfp.
#              Jihad Browser second target; install/run verification is pending hardware.

require conf/machine/include/jihad-touchpad.inc

# Product = opal, board/machine = SHORTLOIN. Exactly the same two-name split tenderloin.conf
# has (product topaz / board tenderloin) — this file used to claim the TouchPad Go had no
# separate product alias, which is backwards: "opal" IS the product codename and the board
# name is one Palm never used in marketing. See the KERNEL_VERSION_STRING note below for the
# evidence; both overrides are exposed so .bbappends can match either name.
MACHINEOVERRIDES =. "opal:shortloin:"

# 7" panel, SAME 1024x768 resolution as the TouchPad → 1280 px diagonal / 7" ≈ 183 dpi.
# Higher density than tenderloin; the resolution is identical, so the render buffer, the
# adapter shmem contract, and both UI .ipks are unchanged — only the physical DPI differs.
JIHAD_SCREEN_INCHES = "7.0"
JIHAD_SCREEN_XRES = "1024"
JIHAD_SCREEN_YRES = "768"
JIHAD_SCREEN_DPI = "183"
MACHINE_DPI = "183"

# Palm 2.6.35 kernel, shortloin board. PINNED 2026-08-15 (T-122), and the value it replaces
# ("2.6.35-palm-opal") was WRONG: there is no opal_defconfig and no "-opal" LOCALVERSION
# anywhere in HP's kernel tree. The board is shortloin; opal is only the product codename.
#
# Derived, not guessed. Linux computes KERNELRELEASE as
#   VERSION.PATCHLEVEL.SUBLEVEL + EXTRAVERSION + CONFIG_LOCALVERSION
# and every term is fixed by HP's own released Opal kernel drop — webos-internals/
# webos-linux-kernel branch "opal", head 683c4b8, commit "opal-submission-65.3.7":
#   Makefile                            VERSION=2 PATCHLEVEL=6 SUBLEVEL=35 EXTRAVERSION=-palm
#   arch/arm/configs/shortloin_defconfig  CONFIG_LOCALVERSION="-shortloin"
#                                         # CONFIG_LOCALVERSION_AUTO is not set
#                                         CONFIG_MACH_SHORTLOIN=y
#   => 2.6.35 + -palm + -shortloin      = 2.6.35-palm-shortloin
# That branch ships exactly three Palm board configs — rump, shortloin, tenderloin — and no
# opal one, so shortloin_defconfig IS the TouchPad Go config.
#
# The derivation is validated against a KNOWN-GOOD control rather than trusted on its own:
# the same tree's tenderloin_defconfig sets CONFIG_LOCALVERSION="-tenderloin" with the same
# EXTRAVERSION, which reproduces "2.6.35-palm-tenderloin" — the string verified on our own
# TouchPad. Same method, same tree, one string already confirmed on hardware.
#
# Corroborated by a third party that actually SHIPPED Opal kernels: webOS Internals' build
# system (support/kernel.mk) sets, for DEVICE=opal, DEFCONFIG=shortloin_defconfig and
# KERNEL_TYPE=2.6.35-palm-shortloin, and uses that literal as the /lib/modules/<KERNEL_TYPE>
# path — if it did not equal `uname -r` on real hardware, their modules would not load.
# Board identity is independently registered: ARM machine 3080 "Shortloin"
# (CONFIG_MACH_SHORTLOIN, registered by Palm's Dmitry Fink 82 seconds after 3079
# "Tenderloin"), and HP's own board-shortloin.c carries enum opal_board_types.
#
# ONE RESIDUAL, stated rather than glossed: HP's Opal source drop is webOS 3.0.3-era, and no
# Opal kernel source was ever published for 3.0.5 (a 3.0.5 Opal doctor did exist; no live
# mirror of it survives). LOCALVERSION here is board-derived, not release-derived, and
# tenderloin's string was byte-identical across 3.0.0 -> 3.0.5, so the 3.0.3 -> 3.0.5 hop is
# sound inference. It is still inference: no `uname` from a physical TouchPad Go exists
# publicly, because the device was cancelled and only prototypes escaped.
# Settle it in one line the first time an Opal is attached [human-review on device]:
#   novacom run file://bin/uname -- -r
KERNEL_VERSION_STRING = "2.6.35-palm-shortloin"
