#@TYPE: Machine
#@NAME: HP TouchPad Go (Opal)
#@DESCRIPTION: HP TouchPad Go — 7" 1024x768 (higher DPI), webOS 3.0.5, ARMv7 softfp.
#              Jihad Browser second target; install/run verification is pending hardware.

require conf/machine/include/jihad-touchpad.inc

# Board/machine = opal (the TouchPad Go has no separate "product" alias like topaz).
MACHINEOVERRIDES =. "opal:"

# 7" panel, SAME 1024x768 resolution as the TouchPad → 1280 px diagonal / 7" ≈ 183 dpi.
# Higher density than tenderloin; the resolution is identical, so the render buffer, the
# adapter shmem contract, and both UI .ipks are unchanged — only the physical DPI differs.
JIHAD_SCREEN_INCHES = "7.0"
JIHAD_SCREEN_XRES = "1024"
JIHAD_SCREEN_YRES = "768"
JIHAD_SCREEN_DPI = "183"
MACHINE_DPI = "183"

# Palm 2.6.35 kernel, opal board variant. [human-review on device — the exact kernel
# version string is not yet confirmed against TouchPad Go hardware; ?= so an on-device
# check can override without editing this file.]
KERNEL_VERSION_STRING ?= "2.6.35-palm-opal"
