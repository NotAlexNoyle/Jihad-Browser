#@TYPE: Machine
#@NAME: HP TouchPad (Topaz / tenderloin)
#@DESCRIPTION: HP TouchPad — 9.7" 1024x768, webOS 3.0.5, ARMv7 softfp. Jihad Browser
#              primary target; the model on which the Enyo variant is verified on-device.

require conf/machine/include/jihad-touchpad.inc

# Product = topaz, board/machine = tenderloin. Both overrides are exposed so recipe
# .bbappends and confs can match either name.
MACHINEOVERRIDES =. "topaz:tenderloin:"

# 9.7" panel, 1024x768 → 1280 px diagonal / 9.7" ≈ 132 dpi.
JIHAD_SCREEN_INCHES = "9.7"
JIHAD_SCREEN_XRES = "1024"
JIHAD_SCREEN_YRES = "768"
JIHAD_SCREEN_DPI = "132"
MACHINE_DPI = "132"

# Palm 2.6.35 tenderloin kernel (verified on device — see KNOWN DEVICE FACTS /
# docs/DEVICE-HANDOFF.md).
KERNEL_VERSION_STRING = "2.6.35-palm-tenderloin"
