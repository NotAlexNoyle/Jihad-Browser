<!DOCTYPE html>
<!-- Jihad Browser test page (cavekit-content-blocking.md R5): after a forced update of the lists the
     next page is blocked by the new set. ||beacon.cdnpure.com^ is in EasyPrivacy 202610191813 and not
     in the bundled 202610151429 (which has only rum.cdnpure.com and paths under cdnpure.com), so with
     the bundled lists the image below is fetched and after the update it is refused: with
     jihad.blocking.log on, the daemon logs "blocked image by ||beacon.cdnpure.com^". The second image
     is a host rule of both lists (the control). Serve it over http from the host PC (python3 -m
     http.server 8077 in render/goanna/test/). Copyright 2026 NotAlexNoyle. Apache-2.0. -->
<html><head><meta charset="utf-8"><title>jihad-blocking-update</title>
<style>li{font:15px sans-serif;margin:6px} .ok{color:#060} .bad{color:#900}</style></head>
<body><h1>jihad-blocking-update</h1><ul id="r"></ul>
<script>
var tests = [
  ["https://beacon.cdnpure.com/jihad-test.gif", "EasyPrivacy 202610191813 ||beacon.cdnpure.com^ (new in the update)"],
  ["https://ad.doubleclick.net/ddm/ad/pixel.gif", "EasyList ||ad.doubleclick.net^ (in both: the control)"]
];
function row(t, cls) { var li = document.createElement("li"); li.className = cls; li.textContent = t; document.getElementById("r").appendChild(li); }
tests.forEach(function (t) {
  var el = document.createElement("img"), done = false;
  el.onload = function () { if (!done) { done = true; row("loaded   " + t[0] + "  — " + t[1], "ok"); } };
  el.onerror = function () { if (!done) { done = true; row("refused/failed  " + t[0] + "  — " + t[1], "bad"); } };
  el.src = t[0];
  document.body.appendChild(el);
});
</script></body></html>
