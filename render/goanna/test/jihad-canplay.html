     jihad-canplay.html — what the engine says it can play, written to the title (the daemon logs
     the page's title changes): H.264 (avc1), AAC, MP3, VP8, VP9, Theora, Opus. -->
<html><head><meta charset="utf-8"><title>canplay</title></head><body>
<script>
var v = document.createElement("video"), a = document.createElement("audio");
var t = [["h264", v, 'video/mp4; codecs="avc1.42E01E"'], ["aac", a, 'audio/mp4; codecs="mp4a.40.2"'], ["mp3", a, "audio/mpeg"],
         ["vp8", v, 'video/webm; codecs="vp8"'], ["vp9", v, 'video/webm; codecs="vp9"'], ["theora", v, 'video/ogg; codecs="theora"'],
         ["opus", a, 'audio/ogg; codecs="opus"']];
document.title = "canplay " + t.map(function (x) { return x[0] + "=" + (x[1].canPlayType(x[2]) || "no"); }).join(" ");
document.body.textContent = document.title;
</script></body></html>
