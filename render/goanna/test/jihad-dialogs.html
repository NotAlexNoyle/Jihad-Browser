<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jihad-dialogs</title>
<style>body{margin:0;background:#210;color:#fff;font:20px sans-serif;padding:16px}
button{font:22px sans-serif;padding:10px 18px;margin:8px 8px 8px 0}</style></head>
<body>
<p>jihad-dialogs: confirm and prompt, each raised from a tap (cavekit-browser-services.md R3)</p>
<button id="c">confirm</button><button id="p">prompt</button>
<p id="r">nothing asked yet</p>
<script>
// #r changes to "... open" BEFORE the call and to the answer only AFTER it returns, so a read
// while the card's dialog is up sees "open" (or nothing at all, the daemon being blocked) and
// the answer appears only once the reply has come back over the pipe.
function ask(id, f) { document.getElementById(id).addEventListener('click', function () {
  var r = document.getElementById('r'); r.textContent = id + ': open'; r.textContent = id + ': ' + f(); }); }
ask('c', function () { return confirm('jihad-dialogs confirm?') ? 'true' : 'false'; });
ask('p', function () { var v = prompt('jihad-dialogs prompt', 'default'); return v === null ? 'null' : '[' + v + ']'; });
</script></body></html>
