<!DOCTYPE html>
<!-- Jihad Browser test page (cavekit-content-blocking.md R3): an @@||host^ exception in the list makes
     that host load. The image comes from ad.doubleclick.net (EasyList ||ad.doubleclick.net^: refused
     with the lists as published), over http on the host PC's port (the device's /etc/hosts maps the
     name to the PC, so only the blocker can stop it). With a list copy that carries
     @@||ad.doubleclick.net^ the image loads and the daemon logs no "blocked" for it. The second image
     is the page's own (the control). Copyright 2026 NotAlexNoyle. Apache-2.0. -->
<html><head><meta charset="utf-8"><title>jihad-exception</title>
<style>li{font:15px sans-serif;margin:6px} .ok{color:#060} .bad{color:#900}</style></head>
<body><h1>jihad-exception</h1><p id="where"></p><ul id="r"></ul>
<script>
document.getElementById("where").textContent = "page host: " + (location.host || "(none)");
var tests = [
  ["http://ad.doubleclick.net:8077/jihad-plain-ok.png", "EasyList ||ad.doubleclick.net^ unless the list also carries @@||ad.doubleclick.net^", "refused as published; loaded with the exception"],
  ["jihad-plain-ok.png", "the page's own image (the control)", "loaded"]
];
function row(t, cls) { var li = document.createElement("li"); li.className = cls; li.textContent = t; document.getElementById("r").appendChild(li); }
var pending = tests.length, loaded = 0;
tests.forEach(function (t) {
  var el = document.createElement("img"), done = false;
  el.onload = function () { if (!done) { done = true; loaded++; row("loaded   " + t[0] + "  — " + t[1] + " — expected: " + t[2], "ok"); if (--pending === 0) document.title = "jihad-exception " + loaded + "/" + tests.length + " loaded"; } };
  el.onerror = function () { if (!done) { done = true; row("refused/failed  " + t[0] + "  — " + t[1] + " — expected: " + t[2], "bad"); if (--pending === 0) document.title = "jihad-exception " + loaded + "/" + tests.length + " loaded"; } };
  el.src = t[0]; document.body.appendChild(el);
});
</script></body></html>
