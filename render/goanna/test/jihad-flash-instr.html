<!doctype html>
<!-- Copyright 2026 NotAlexNoyle. MPL-2.0.
     jihad-flash-instr.html: an instrumented movie (make-instrument-swf.py) and what it reports, in elements a check reads
     (cavekit-flash.md R2, R4). ?movie=avm1|avm2&swf=FILE&scale=showAll&w=400&h=300&vars=a=b&wmode=&allow=&bg=&tag=&layout=&api=1&over=1&bench=1 -->
<html><head><meta charset="utf-8"><title>jihad-flash-instr</title>
<script>if (!/[?&]fit=1/.test(location.search)) { document.write('<meta name="viewport" content="width=device-width">'); }</script>
<style>
  body { margin: 0; font: 14px/1.3 monospace; background: #ddd; }
  #m { display: block; margin: 40px 0 0 40px; }
  #report div { min-height: 18px; }
</style></head>
<body>
<div id="wide" style="width:1;height:1"></div>
<div id="holder"></div>
<div id="report">
  <div id="ready">-</div><div id="down">-</div><div id="up">-</div><div id="move">-</div>
  <div id="keydown">-</div><div id="keyup">-</div><div id="frames">-</div><div id="video">-</div><div id="vmeta">-</div><div id="vstatus">-</div>
  <div id="vars">-</div><div id="so">-</div><div id="echo">-</div><div id="echoback">-</div><div id="geturl">-</div><div id="fscommand">-</div><div id="data">-</div><div id="kid">-</div><div id="fs">-</div><div id="detect">-</div>
  <div id="n-down">0</div><div id="n-up">0</div><div id="n-move">0</div><div id="heldms">0</div><div id="keyheldms">-</div><div id="moverate">0</div>
  <div id="count">0</div><div id="all"></div>
</div>
<script>
  var q = {}; location.search.replace(/[?&]([^=]+)=([^&]*)/g, function (m, k, v) { q[k] = decodeURIComponent(v); });
  var benchFrames = 0, benchT0 = Date.now();
  var n = 0, all = [], keyAt = 0, pressAt = 0, movesInPress = 0, firstMove = 0, lastMove = 0;
  function jihadFlash(s) {
    s.split(";").forEach(function (line) {
      if (!line) { return; }
      n++; all.push(line); if (all.length > 12) { all.shift(); }
      var kind = line.split(" ")[0], e = document.getElementById(kind);
      // the player moves the mouse off the stage when a press ends (-1,-1): the path's end is the line before
      if (e && line != "move -1 -1") { e.textContent = line; }
      // what a check of input reads: how many of each, how long a press lasted, how fast the moves of one came
      var c = document.getElementById("n-" + kind), now = Date.now();
      if (c) { c.textContent = String(Number(c.textContent) + 1); }
      if (kind == "down") { pressAt = now; movesInPress = 0; firstMove = 0; lastMove = 0; }
      // how long the movie saw a key down: a game that polls the keys once a frame never sees one shorter than a frame
      if (kind == "keydown") { keyAt = now; }
      if (kind == "keyup" && keyAt) { document.getElementById("keyheldms").textContent = String(now - keyAt); keyAt = 0; }
      if (kind == "up" && pressAt) {
        document.getElementById("heldms").textContent = String(now - pressAt);
        if (lastMove > firstMove) { document.getElementById("moverate").textContent = String(Math.round((movesInPress - 1) * 1000 / (lastMove - firstMove))); }
      }
      if (kind == "move" && line != "move -1 -1" && pressAt) {
        movesInPress++; if (!firstMove) { firstMove = now; } lastMove = now;
      }
    });
    // bench=1 (lowpower-bench's flash measure, T-638): every movie's frame lines summed into the title the daemon logs
    if (q.bench) { benchFrames += 30 * (s.match(/(^|;)frames /g) || []).length; document.title = "jihad-flash: frames=" + benchFrames + " ms=" + (Date.now() - benchT0); }
    document.getElementById("count").textContent = String(n);
    document.getElementById("all").textContent = all.join(" | ");
  }
  if (q.fit) { document.getElementById("wide").style.width = "1000px"; }   // a page wider than the card: the fit zoom below 1
  var w = q.w || 400, h = q.h || 300, movie = q.swf || ("jihad-instr-" + (q.movie || "avm1") + ".swf");
  var vars = "scale=" + (q.scale || "") + (q.vars ? "&" + q.vars : "");
  var src = movie, fv = vars, allow = q.allow || "always", wm = q.wmode ? ' wmode="' + q.wmode + '"' : '', sc = q.scale ? ' scale="' + q.scale + '"' : '';
  var size = ' width="' + (q.layout == "percent" ? "50%" : w) + '" height="' + h + '"';
  function embedOf(id) {
    return '<embed id="' + id + '" name="' + id + '" src="' + src + '" type="application/x-shockwave-flash"' + size + ' allowScriptAccess="' + allow + '" allowFullScreen="true" swLiveConnect="true" flashvars="' + fv + '"' + wm + sc + '>';
  }
  function params() {
    return '<param name="allowScriptAccess" value="' + allow + '"><param name="flashvars" value="' + fv + '">' + (q.wmode ? '<param name="wmode" value="' + q.wmode + '">' : '') + (q.scale ? '<param name="scale" value="' + q.scale + '">' : '');
  }
  // ?tag=object|param|nested: the other ways a page carries a movie. ?layout=percent|three|frame|below|hidden: the places it stands
  var html;
  if (q.tag == "object") html = '<object id="m" data="' + src + '" type="application/x-shockwave-flash"' + size + '>' + params() + '</object>';
  else if (q.tag == "param") html = '<object id="m" type="application/x-shockwave-flash"' + size + '><param name="movie" value="' + src + '">' + params() + '</object>';
  else if (q.tag == "nested") html = '<object classid="clsid:D27CDB6E-AE6D-11cf-96B8-444553540000"' + size + '><param name="movie" value="' + src + '">' + params() + '<object id="m" data="' + src + '" type="application/x-shockwave-flash"' + size + '>' + params() + '</object></object>';
  else if (q.layout == "three") html = embedOf("m") + embedOf("m2") + embedOf("m3");
  else if (q.layout == "frame") html = '<iframe id="m" src="jihad-flash-instr.html?movie=' + (q.movie || "avm1") + '&inframe=1&w=' + w + '&h=' + h + '" width="' + w + '" height="' + h + '" frameborder="0" scrolling="no" style="display:block;margin:40px 0 0 40px"></iframe>';
  else if (q.layout == "column") { html = ""; for (var i = 0; i < 6; i++) { html += embedOf(i ? "m" + (i + 1) : "m") + '<div style="height:500px"></div>'; } }   // movies down a page the bench pans
  else if (q.layout == "low") html = '<div style="height:480px"></div>' + embedOf("m");
  else if (q.layout == "below") html = '<div style="height:1500px"></div>' + embedOf("m");
  else if (q.layout == "hidden") html = '<button id="show" style="display:block;width:300px;height:60px;margin:20px 0 0 40px" onclick="document.getElementById(\'m\').style.display=\'block\'">show</button>' + embedOf("m").replace('<embed ', '<embed style="display:none" ');
  else html = embedOf("m");
  document.getElementById("holder").innerHTML = html;
  if (q.bg) { document.body.style.background = "#" + q.bg; }
  if (q.inframe) {   // in a frame: no margins, and the lines go to the page around it
    document.getElementById("m").style.margin = "0"; document.body.style.margin = "0"; document.body.style.overflow = "hidden";
    if (window.parent !== window) { window.jihadFlash = function (s) { window.parent.jihadFlash(s); }; }
  }
  window.m_DoFSCommand = function (c, a) { jihadFlash("fscommand " + c + " " + a); };
  (function () {   // the detection script most pages carry
    var d = navigator.plugins["Shockwave Flash"], t = navigator.mimeTypes["application/x-shockwave-flash"];
    document.getElementById("detect").textContent = "detect plugin " + (d ? d.description : "none") + " mime " + (t && t.enabledPlugin ? "yes" : "no");
  })();
  if (q.api) {   // the page calls the movie: until it answers
    var tries = 0, ask = setInterval(function () {
      var m = document.getElementById("m");
      try { if (m && m.jihadEcho) { document.getElementById("echoback").textContent = "echoback " + m.jihadEcho("hi"); clearInterval(ask); } } catch (e) {}
      if (++tries > 120) { clearInterval(ask); }
    }, 500);
  }
  // ?over=1: a button that puts an element over the movie and takes it away, on a page that scrolls
  if (q.over) {
    var over = document.createElement("div");
    over.id = "over";
    over.style.cssText = "position:absolute;background:#f00;display:none;left:40px;top:40px;width:" + w + "px;height:" + h + "px";
    document.body.appendChild(over);
    var toggle = document.createElement("button");
    toggle.id = "toggle"; toggle.textContent = "over";
    toggle.style.cssText = "display:block;width:300px;height:60px;margin:20px 0 0 40px";
    toggle.onclick = function () { over.style.display = over.style.display == "none" ? "block" : "none"; };
    document.getElementById("holder").appendChild(toggle);
    var tall = document.createElement("div"); tall.style.height = "3000px"; document.body.appendChild(tall);
  }
</script>
</body></html>
