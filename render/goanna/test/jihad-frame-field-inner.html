<html><head><meta charset="utf-8"><title>inner</title>
<style>body{font:20px sans-serif;margin:12px;background:#eef} input{font:22px sans-serif;width:90%;padding:8px} .e{color:#060;margin:8px 0}</style></head>
<body>
<p>inside the frame:</p>
<input id="inner" type="text" placeholder="field in the frame">
<div class="e" id="e-inner">inner: -</div>
<script>
document.getElementById('inner').addEventListener('input', function () {
  document.getElementById('e-inner').textContent = 'inner: ' + this.value;
});
</script>
</body></html>
