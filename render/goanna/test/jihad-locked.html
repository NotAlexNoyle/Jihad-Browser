<!-- T-644 device test: a page that locks its zoom (user-scalable=no, maximum-scale=1) and fits the card. With
     jihad.zoom.allowEveryPage (the default) a pinch still zooms it; with the pref off it stays at 1. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>locked</title>
<style>body{margin:0;font:22px sans-serif;background:#fff;color:#000}h1{margin:0;padding:16px;background:#642;color:#fff}
p{margin:16px}.b{display:inline-block;width:150px;height:150px;margin:8px}</style>
</head><body><h1>Zoom locked by the page</h1>
<p>This page asks for user-scalable=no and maximum-scale=1. A pinch should still zoom it while the setting
"Allow zoom on every page" is on.</p>
<div><span class="b" style="background:#c33"></span><span class="b" style="background:#3c3"></span><span class="b" style="background:#33c"></span><span class="b" style="background:#cc3"></span></div>
<p>The quick brown fox jumps over the lazy dog. 0123456789</p></body></html>
