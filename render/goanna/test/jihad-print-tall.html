<!DOCTYPE html><html><head><meta charset="utf-8"><title>jihad print test, tall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A page three sheets long, for checking how a print is cut. Every 200 px down the page
     there is a numbered rule, so a sheet shows which part of the page it carries and whether
     a line was lost or printed twice at a cut. White background on purpose: it is meant to be
     printable without spending ink. -->
<style>
body{margin:0;padding:0;background:#fff;color:#111;font:16px/1.4 sans-serif}
h1{font-size:24px;margin:0;padding:14px 24px 6px}
.band{position:relative;height:199px;border-top:1px solid #111;box-sizing:content-box}
.band b{position:absolute;left:24px;top:6px;font-size:20px}
.band span{position:absolute;right:24px;top:8px;color:#666}
.band i{position:absolute;left:24px;right:24px;top:60px;font-style:normal;color:#444}
</style></head><body>
<h1>Jihad Browser — tall print test</h1>
<script>
for (var i = 0; i < 14; i++) {
  document.write('<div class="band"><b>' + (i * 200) + ' px</b><span>band ' + (i + 1) + ' of 14</span>' +
    '<i>Each band is 200 px of page. A Letter sheet carries the page width by 1.29 times that; ' +
    'a cut may fall inside a band but no band may be missing or repeated.</i></div>');
}
</script>
<div style="border-top:3px double #111;padding:10px 24px">end of page</div>
</body></html>
