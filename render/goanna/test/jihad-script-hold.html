<!doctype html>
<!-- Copyright 2026 NotAlexNoyle. MPL-2.0.
     jihad-script-hold.html — a long page whose script holds the engine's main thread most of the
     time (600 ms of busy loop every 700 ms), for T-515 (cavekit-gpu-rendering R3, R6): the card's
     pan and zoom must still get frames while the script runs, from the layer tree as it stands.
     ?hold=<ms>&every=<ms> change the loop; ?hold=0 turns it off (the same page as a control). -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>jihad-script-hold</title>
<style>
  body { margin: 0; font: 20px/1.4 sans-serif; background: #f4f1ea; }
  #header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #6b2b2b; color: #fff;
            line-height: 56px; padding-left: 16px; z-index: 3; }
  #content { padding: 72px 16px 16px; }
  .band { height: 180px; margin: 12px 0; border-radius: 6px; color: #fff; font-size: 28px; padding: 12px; }
  p { margin: 10px 0; }
</style></head>
<body>
<div id="header">jihad-script-hold <span id="state"></span></div>
<div id="content"></div>
<script>
  var q = {}; location.search.replace(/[?&]([^=]+)=([^&]*)/g, function (m, k, v) { q[k] = +v; });
  var hold = q.hold !== undefined ? q.hold : 600, every = q.every || 700;
  var c = document.getElementById('content'), html = '';
  var colors = ['#2b6c4e', '#2b4c7e', '#7e5a2b', '#5a2b7e', '#7e2b4c', '#2b7e7a'];
  for (var i = 0; i < 60; i++) {
    html += '<div class="band" style="background:' + colors[i % colors.length] + '">Band ' + i + '</div>';
    html += '<p>Paragraph ' + i + ': the quick brown fox jumps over the lazy dog, and the card keeps its frames ' +
            'while the page is busy. Pack my box with five dozen liquor jugs.</p>';
  }
  c.innerHTML = html;
  var n = 0;
  if (hold > 0) setInterval(function () {
    var t = Date.now();
    while (Date.now() - t < hold) {}
    document.getElementById('state').textContent = '(held ' + (++n) + ')';
  }, every);
</script>
</body></html>
