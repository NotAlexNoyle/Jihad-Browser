<!doctype html>
<!-- Copyright 2026 NotAlexNoyle. MPL-2.0.
     jihad-scroll-js.html — a long page that scrolls itself (window.scrollBy, 6 px every 16 ms,
     bouncing), with a fixed header and a scroll counter. On the software path every step repaints
     a band; on the compositor (T-502) a step inside the displayport is an empty transaction plus
     a composite, and the daemon's "layers" time per frame says which. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>jihad-scroll-js</title>
<style>
  body { margin: 0; font: 20px/1.4 sans-serif; background: #f8f6f0; }
  #header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #2b4c7e; color: #fff;
            line-height: 56px; padding-left: 16px; z-index: 3; }
  #pos { position: fixed; right: 16px; top: 72px; z-index: 5; background: #000; color: #0f0;
         font: bold 26px monospace; padding: 4px 10px; }
  #content { padding: 72px 16px 16px; }
  #content p { margin: 0 0 10px; }
  #content p:nth-child(10n) { background: #ffe9a8; }
</style></head>
<body>
<div id="header">jihad-scroll-js: a fixed header</div>
<div id="pos">0</div>
<div id="content">
<script>
  for (var i = 1; i <= 300; i++) document.write("<p>" + i + ": the quick brown fox jumps over the lazy dog; pack my box with five dozen liquor jugs; how vexingly quick daft zebras jump.</p>");
  var dir = 1, n = 0, t0 = Date.now();
  setInterval(function () {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY + dir * 6;
    if (y >= max) { y = max; dir = -1; } else if (y <= 0) { y = 0; dir = 1; }
    window.scrollTo(0, y); n++;
    var dt = Date.now() - t0;
    if (dt >= 1000) { document.getElementById("pos").textContent = Math.round(y) + " px, " + Math.round(n * 1000 / dt) + " steps/s"; n = 0; t0 = Date.now(); }
  }, 16);
</script>
</div>
</body></html>
