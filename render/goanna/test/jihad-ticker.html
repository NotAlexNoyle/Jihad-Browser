<!DOCTYPE html><html><head><meta charset="utf-8"><title>jihad-ticker</title>
<style>body{margin:0;background:#111;color:#0f0;font:28px monospace;padding:24px}#late{color:#ff0;font-size:16px}</style></head>
<body><p>jihad-ticker: a DOM change once a second from a timer</p>
<div id="n">0</div><div id="late">late: -</div>
<script>
// Quiet-tick probe (cavekit-engine-embedding.md R3). #n counts one-second timer fires; #late is
// how late each fire was against the wall clock (max and mean, ms) — a pump that only runs
// every quiet period shows up here as lateness, a missed repaint shows up as #n and the
// screenshot disagreeing.
var n = 0, t0 = Date.now(), maxLate = 0, sumLate = 0;
setInterval(function () {
  n++;
  var late = Date.now() - (t0 + n * 1000);
  if (late < 0) late = 0;
  if (late > maxLate) maxLate = late; sumLate += late;
  document.getElementById('n').textContent = n;
  document.getElementById('late').textContent = 'late: max=' + maxLate + ' mean=' + Math.round(sumLate / n);
}, 1000);
</script></body></html>
