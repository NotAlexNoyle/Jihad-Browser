<!-- Jihad Browser — DEVICE TEST PAGE, never packaged: which modern web features the engine offers.
     Each line says yes or no, large enough to read in a card screenshot. Used before and after an
     engine update (cavekit-engine-update.md R8) to see what the update brought. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Modern web features</title>
<style>
  body { font: 22px/1.35 sans-serif; margin: 12px; background: #fff; color: #111; }
  .yes { color: #0a6b1f; } .no { color: #b3241f; }
  b { display: inline-block; min-width: 2.6em; }
  /* Layered only: an unlayered rule would outrank both layers whatever revert-layer does. */
  @layer base, top;
  @layer base { #rl { color: green; } }
  @layer top { #rl { color: red; color: revert-layer; } }
</style>
</head>
<body>
<div id="out"></div>
<div id="rl" style="font-size:14px">revert-layer sample</div>
<div id="has-host" style="font-size:14px"><span class="hit">:has sample</span></div>
<script>
var out = document.getElementById("out");
function line(name, ok, note) {
  var d = document.createElement("div");
  d.innerHTML = "<b class=" + (ok ? "yes" : "no") + ">" + (ok ? "yes" : "no") + "</b> " + name + (note ? " — " + note : "");
  out.appendChild(d);
}
function t(name, fn) { var r = false, n = ""; try { r = fn(); if (typeof r === "string") { n = r; r = true; } } catch (e) { n = String(e).slice(0, 60); r = false; } line(name, !!r, n); }
t("adoptedStyleSheets", function () { var s = new CSSStyleSheet(); s.replaceSync("body{}"); document.adoptedStyleSheets = [s]; return document.adoptedStyleSheets.length === 1; });
t("CSSStyleSheet.replaceSync", function () { return typeof CSSStyleSheet.prototype.replaceSync === "function"; });
t("URL.parse()", function () { return typeof URL.parse === "function" && URL.parse("https://a.b/c").pathname === "/c"; });
t("CSS revert-layer", function () { return getComputedStyle(document.getElementById("rl")).color === "rgb(0, 128, 0)"; });
t("CSS aspect-ratio", function () { return CSS.supports("aspect-ratio", "1 / 1"); });
t("CSS :has()", function () { return document.querySelector("#has-host:has(.hit)") !== null; });
t("WeakRef", function () { return typeof WeakRef === "function" && new WeakRef({}).deref() !== undefined; });
t("structuredClone", function () { return typeof structuredClone === "function"; });
t("Object.groupBy", function () { return typeof Object.groupBy === "function"; });
t("Array.prototype.at", function () { return [1, 2, 3].at(-1) === 3; });
t("BigInt", function () { return typeof BigInt === "function" && (BigInt(2) ** BigInt(64)).toString() === "18446744073709551616"; });
t("customElements", function () { return typeof customElements === "object"; });
t("ResizeObserver", function () { return typeof ResizeObserver === "function"; });
t("dialog element", function () { return typeof HTMLDialogElement === "function"; });
t("CSS grid", function () { return CSS.supports("display", "grid"); });
line("engine", true, navigator.userAgent.replace(/^.*\) /, ""));
</script>
</body>
</html>
